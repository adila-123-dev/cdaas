services:
  postgres:
    image: postgres:16-alpine
    container_name: cdaas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cdaas
      POSTGRES_USER: cdaas
      POSTGRES_PASSWORD: cdaas_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: cdaas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: cdaas-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
volumes:
  postgres_data:
